version: "3.8"

services:

  envoy:
    image: envoyproxy/envoy:v1.36.2
    # below 2 lines needed only for podman
    user: root
    privileged: true
    ports:
      - "10000:10000"   # this is where you'll send your curl requests
      - "9901:9901"     # envoy admin dashboard
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
      - ./lua:/etc/envoy/lua
    networks:
      - poc-network

  service3-internal:
    image: python:3.11-slim
    volumes:
      - ./mock-services:/app
    working_dir: /app
    command: python service3_internal.py
    networks:
      poc-network:
        aliases:
          - service3.internal.preprod.hotstar.com

  feature-env-service:
    image: python:3.11-slim
    volumes:
      - ./mock-services:/app
    working_dir: /app
    command: python featureenv.py
    networks:
      poc-network:
        aliases:
          - service2.internal.qa.hotstar.com   # QA / feature-env version of service2

  service1:
    image: python:3.11-slim
    volumes:
      - ./mock-services:/app
    working_dir: /app
    command: python service1.py
    ports:
      - "10001:8080"
    networks:
      poc-network:
        aliases:
          - origin-service1.preprod.hotstar-labs.com

  service2-preprod:
    image: python:3.11-slim
    volumes:
      - ./mock-services:/app
    working_dir: /app
    command: python service2_preprod.py
    ports:
      - "10002:8080"
    networks:
      poc-network:
        aliases:
          - origin-service2.preprod.hotstar-labs.com

networks:
  poc-network:
    driver: bridge