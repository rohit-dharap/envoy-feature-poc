static_resources:

  listeners:
    - name: main_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      inline_code: |
                        dofile("/etc/envoy/lua/routing_filter.lua")
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: [ "*" ]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster_header: "x-feature-target-cluster"

  clusters:
    - name: preprod_cluster
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: preprod_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: preprod-service
                      port_value: 8080

    - name: feature_env_cluster
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: feature_env_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: feature-env-service
                      port_value: 8080

    - name: pp_cluster
      connect_timeout: 5s
      type: STRICT_DNS
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: origin-sports-test-data-service.preprod.hotstar-labs.com
      load_assignment:
        cluster_name: pp_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: origin-sports-test-data-service.preprod.hotstar-labs.com
                      port_value: 443

    - name: pp_cluster_internal
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: pp_cluster_internal
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: sports-test-data-service.internal.preprod.hotstar.com
                      port_value: 80

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901